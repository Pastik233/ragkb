services:
  postgres:
    # 官方 pgvector 镜像，已内置 vector 扩展，省掉自己编译
    image: pgvector/pgvector:pg17
    container_name: rag-postgres
    environment:
      POSTGRES_DB: ragkb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragkb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: