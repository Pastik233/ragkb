server:
  port: 8080

spring:
  application:
    name: ragkb
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ragkb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      # pgvector 的 HNSW 检索宽度：默认 40 在候选多时召回不够，100 是精度/延迟的折中。
      # 用连接初始化 SQL 下发，等价于每条连接执行一次 SET hnsw.ef_search = 100
      connection-init-sql: SET hnsw.ef_search = ${app.rag.hnsw-ef-search:100}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  ai:
    openai:
      # 百炼的 OpenAI 兼容端点。Spring AI 2.0 底层是官方 openai-java SDK，
      # base-url 要包含 /v1，SDK 会自行拼 /chat/completions。
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      # 占位值保证没配 Key 时自动配置仍能装配（与 dashscope.api-key 的语义一致：调用时才报错）
      api-key: ${DASHSCOPE_API_KEY:sk-not-configured}
      chat:
        model: ${app.chat.model:qwen-flash}
        # 官方 SDK 默认没有读超时，上游卡住会耗光 Tomcat 线程
        timeout: ${app.http.read-timeout-seconds:60}s
      embedding:
        # 单一数据源：写进 note_chunks.embedding_model 的名字必须等于实际调用的模型，
        # 否则检索时会被 c.embedding_model = #{model} 过滤成空结果
        model: ${app.embedding.model}
        timeout: ${app.http.read-timeout-seconds:60}s
    model:
      chat: openai
      embedding: openai

mybatis:
  # SQL 全部放在 XML 里，接口只留签名
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 显式 resultMap 用不到这项，留给将来用 resultType 的简单查询兜底
    map-underscore-to-camel-case: true


app:
  rag:
    max-distance: 0.75
    vector-candidates: 20
    keyword-candidates: 20
    rrf-k: 60
    rerank-candidates: 20
    hnsw-ef-search: 100
  rerank:
    enabled: true
    base-url: https://dashscope.aliyuncs.com/api/v1
    model: qwen3-rerank
  http:
    # 没有读超时上游卡住会把 Tomcat 线程耗光，必须显式设
    connect-timeout-seconds: 5
    read-timeout-seconds: 60
  embedding:
    # 由 spring.ai.openai.embedding.model 引用；改这里要一起重建索引，
    # 且向量维度变化还要新增 Flyway 迁移改 vector(N) 并重建 HNSW 索引
    model: qwen3.7-text-embedding
  chat:
    model: qwen-flash
  ingestion:
    max-extracted-chars: 2000000
    chunk-max-chars: 800
    chunk-overlap-chars: 150
    embedding-batch-size: 10

dashscope:
  # 默认空串：没配 Key 也能启动（上传/检索才会报错），不再是启动即崩
  api-key: ${DASHSCOPE_API_KEY:}